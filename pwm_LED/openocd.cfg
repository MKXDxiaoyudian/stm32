# Adapter configration (CMSIS-DAP)
source [find interface/cmsis-dap.cfg]

#Target configration (STM32F1)
source [find target/stm32f1x.cfg]

# Reset configuration
# ⚠️ 2026-10-02 修正：原来这里写的是 `reset_config srst_only srst_nogate`，
#    意思是「只用物理 SRST（nRESET）引脚做复位」—— 但本工程的接线表里
#    DAP 只接了 SWDIO / SWCLK / GND / 3.3V，**nRESET 没有接**。
#    结果 reset halt 会一直等一个不会发生的复位，报：
#        Error: timed out while waiting for target halted
#        ** Unable to reset target **
#    改成 none（不依赖复位线），openocd 就用 DAP 的软件复位
#    （stm32f1x.cfg 里的 `cortex_m reset_config sysresetreq`），走 SWD 完成，实测可用。
#    如果你以后把 nRESET 接到 DAP 上了，可以改回 srst_only。
reset_config none

cmsis_dap_vid_pid 0x0483 0x572a
